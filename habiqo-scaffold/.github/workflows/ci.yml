name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build

  migration-check:
    name: Migration paired with code change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify schema changes have a migration
        run: |
          # If any file under packages/database/src/types.ts changes without
          # a corresponding migration in supabase/migrations, fail the build.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          types_changed=$(git diff --name-only "$base" "$head" -- packages/database/src/types.ts | wc -l)
          migrations_added=$(git diff --name-only --diff-filter=A "$base" "$head" -- 'supabase/migrations/*.sql' | wc -l)
          if [ "$types_changed" -gt 0 ] && [ "$migrations_added" -eq 0 ]; then
            echo "::error::DB types changed without a new migration. Add one in supabase/migrations/."
            exit 1
          fi
          echo "OK"
